# Grouped so an ecosystem's routine bumps arrive as ONE pull request instead of
# one per dependency. Ungrouped, this fleet opened 1,461 PRs across 176 repos.
#
# Majors are deliberately left OUT of the npm group. When the 2026-08-18 backlog
# was landed by hand, 109 bumps had to be held back and they were overwhelmingly
# majors -- @noble/curves and @noble/hashes v2 dropped the export subpaths this
# lab's source imports, and TypeScript 7 / vitest 4 broke a smaller set. Grouping
# a breaking major together with the safe bumps makes the whole PR unmergeable,
# so majors come individually and a human decides.
#
# github-actions majors are now split out of their group too. They used to be
# grouped on the strength of one verified batch (checkout v4->v7, setup-node
# v4->v7, the Pages v5/v6 jumps, all green across 176 repos on 2026-08-18), but
# "these particular majors were safe once" is not a property of future majors,
# and an Actions major that changes an input breaks the whole grouped PR.
#
# Both minor/patch groups and every individual major PR auto-merge only once this
# lab's FULL gate passes on the PR -- the npm audit job and the unit/build/axe/e2e
# job, both listed in `needs:` by dependabot-auto-merge in the deploy workflow.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Minors and patches are grouped; majors are split out for the same reason as
  # npm's -- an Actions major can change or remove inputs
  # (upload-pages-artifact v3 renamed `path` handling, deploy-pages v4 changed its
  # id-token requirements), and a breaking major bundled with safe ones makes the
  # whole PR unmergeable.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
