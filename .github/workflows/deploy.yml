name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Vulnerability gate ───────────────────────────────────────────────────
  # `npm audit --audit-level=moderate` exits non-zero on any moderate, high or
  # critical advisory, so this job FAILS CLOSED: a PR that introduces one cannot
  # go green, and `deploy` and `dependabot-auto-merge` both list it in `needs:`
  # so neither can run past it. Dev dependencies are audited too, deliberately —
  # the build pipeline is part of this lab's attack surface, and a compromised
  # bundler ships to Pages just as surely as a compromised runtime dependency
  # would.
  #
  # `npm ci` is used rather than `npm install` so the audit describes the exact
  # tree the build and the tests will use, not a freshly re-resolved one.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: npm audit (moderate and above)
        run: npm run audit:ci

      # A tag is a pointer its owner can move; a commit SHA cannot be. An
      # unpinned action runs with this repository's GITHUB_TOKEN and its
      # pages: write permission, and leaves no trace in this repo's diff.
      - name: Every GitHub Action is pinned to a commit SHA
        run: npm run check:action-pins

      - name: Generate CycloneDX SBOM
        run: npm run sbom

      - name: Publish the SBOM as a build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

  build:
    runs-on: ubuntu-24.04
    # `attestations`/`id-token` are for the SLSA provenance step below; the
    # top-level grant is read-only, so this is the narrowest place to add them.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from .nvmrc so CI and a local checkout cannot drift. Node 20 was
          # pinned here before and is both end-of-life and outside vitest 5's
          # supported range (^22.12.0 || ^24.0.0 || >=26.0.0), so the unit suite
          # had been running on an unsupported major.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The vitest suite: ML-DSA sign/verify and the claim-evidence checks.
      # Deploy previously ran only test:a11y, so neither gated a publish — a
      # build whose signatures verified nothing could ship as long as the
      # page passed axe.
      - name: Unit tests
        run: npm test

      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:a11y

      # Build a SECOND time from a clean tree and require byte-identical output.
      #
      # It is reproducible today, and reproducibility is exactly the kind of
      # property that is lost by accident — a timestamp, a hash-map iteration
      # order, a bundler's parallelism — and noticed years later. Without it
      # nobody, including the maintainer, can check what Pages is serving
      # against what was committed.
      - name: The build is reproducible
        run: |
          node scripts/hash-dist.mjs > /tmp/first.sha256
          rm -rf dist
          npm run build
          node scripts/hash-dist.mjs > /tmp/second.sha256
          if ! diff -u /tmp/first.sha256 /tmp/second.sha256; then
            echo "::error::two clean builds of the same commit produced different bytes"
            exit 1
          fi
          echo "Two clean builds are byte-identical:"
          cat /tmp/second.sha256
          cp /tmp/second.sha256 dist-sha256.txt

      - name: Publish the build manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-sha256
          path: dist-sha256.txt
          if-no-files-found: error

      # SLSA build provenance, signed by GitHub's OIDC identity and verifiable
      # with `gh attestation verify`. It ties these exact bytes to this exact
      # workflow run on this exact commit — which, together with the
      # reproducibility check above, is what lets someone else rebuild and
      # compare rather than take the published bundle on trust.
      #
      # Only on a real push to main: a pull-request run has no business minting
      # an attestation for something that is not going to be published.
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/**/*'

      - name: Remove the manifest before packaging
        run: rm -f dist-sha256.txt

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # Lighthouse budgets, three runs. Separate from `build` so a noisy
  # performance score on a shared runner is legible as its own failure rather
  # than looking like a broken test, and so it can run in parallel.
  lighthouse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      # A readiness loop rather than a wait-for-it package: one fewer dependency
      # inside the audit gate, for four lines of shell.
      - name: Serve the production build
        run: |
          npm run preview -- --port 4173 --strictPort &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4173/crypto-lab-dilithium-seal/ >/dev/null; then
              echo "preview is up"; exit 0
            fi
            sleep 1
          done
          echo "preview did not come up within 60s" >&2; exit 1

      # Performance / best-practices / SEO are judged on the MEDIAN of three
      # runs, because a single run on a shared runner is noisy enough to fail at
      # random -- which trains everyone to re-run CI until it passes, at which
      # point the gate has stopped being one. Accessibility is judged on the
      # WORST run, because its threshold is 1.00 and it is scored from
      # deterministic audits rather than timings.
      - name: Lighthouse budgets
        run: npm run lighthouse -- http://localhost:4173/crypto-lab-dilithium-seal/

      - name: Publish the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: lighthouse-report/
          if-no-files-found: warn

  deploy:
    if: github.event_name != 'pull_request'
    needs: [audit, build, lighthouse]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The only check that looks at what visitors actually load. Everything above
  # tests a build; a publish can still partially succeed, serve a stale asset
  # from a CDN, or upload from the wrong directory — each of which leaves the
  # whole suite green and the site broken.
  verify-deployment:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      # Hashes every asset the live page references against a fresh build of
      # this commit — which only means anything because the build is
      # reproducible, enforced above — and then drives a real keygen, sign,
      # verify and tamper-rejection in a browser against the deployed bytes.
      - name: The deployed site is this build, and it works
        run: npm run verify:deployment -- "${{ needs.deploy.outputs.page_url || 'https://systemslibrarian.github.io/crypto-lab-dilithium-seal/' }}"

  # Dependabot only. Runs after EVERY gate above, so a bump can only merge itself
  # if the vulnerability audit and action-pin check passed, this lab's own unit
  # tests, build and axe/e2e run went green, AND the Lighthouse budgets were met.
  # `needs:` is what makes each of those non-optional: a bump that pulls in a
  # moderate-or-higher advisory, or that costs a point of accessibility, can no
  # longer merge itself.
  dependabot-auto-merge:
    needs: [audit, build, lighthouse]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required by the deploy dispatch; without it gh workflow run 403s
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # Majors included on purpose. `needs:` above already required the whole
      # gate to pass, and that gate -- unit tests, build, axe WCAG and the e2e
      # claims -- judges a bump far better than its version number does. A major
      # that actually breaks this lab fails the gate and stays open for a human.
      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::deploy dispatch failed; run deploy.yml by hand"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
